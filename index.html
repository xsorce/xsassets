<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xsassets</title>
<style>
  :root { --bg: #0a0a0b; --card: #141416; --line: rgba(255,255,255,.08); --text: #ececee; --muted: #8d8d94;
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  main { max-width: 1040px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { margin: 0 0 32px; font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { display: block; border: 1px solid var(--line); border-radius: 16px; background: var(--card); overflow: hidden;
    color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  .card:hover, .card:focus-visible { border-color: rgba(255,255,255,.22); transform: translateY(-2px); outline: none; }
  .preview { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #000; }
  /* demo rendered at 1280x800 and scaled down; non-interactive so the card stays one link */
  .preview iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .meta { padding: 14px 16px; }
  .meta code { font: 14px ui-monospace, "Cascadia Code", Menlo, monospace; }
  .meta p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>xsassets</h1>
  <div class="grid">
    <!-- one card per component: href = demo page -->
    <a class="card" href="components/koi-home/demo.html">
      <div class="preview"><iframe src="components/koi-home/demo.html" loading="lazy" tabindex="-1" aria-hidden="true" title=""></iframe></div>
      <div class="meta"><code>&lt;xs-koi-home&gt;</code><p>Pixel koi pond homepage with Arabic greeting, chat and / commands.</p></div>
    </a>
  </div>
</main>
<script>
  // scale each 1280px-wide preview to fit its card
  const fit = () => document.querySelectorAll('.preview').forEach(p => p.firstElementChild.style.transform = `scale(${p.clientWidth / 1280})`);
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
